<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family store for men</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page success">
  <div class="container success__inner">
    <a th:href="@{/}" class="logo" style="margin-bottom:60px">
      <span class="logo__main">FAMILY</span>
      <span class="logo__sub">STORE · FOR MEN</span>
    </a>
    <p class="eyebrow eyebrow--gold" th:text="${status}">404</p>
    <h1 class="section__title" th:text="${status == 404} ? #{error.title} : 'Xatolik yuz berdi'">Sahifa topilmadi</h1>
    <p class="success__text" th:if="${status == 404}" th:text="#{error.text}"></p>
    <a th:href="@{/}" class="btn btn--dark" th:text="#{success.home}"></a>
  </div>
</main>
</body>
</html>
