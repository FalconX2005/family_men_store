<!doctype html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ===== <head> ===== -->
<th:block th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — Family store for men'">Family store for men</title>
  <meta name="description" content="Nike, Adidas, Puma — AQSH, Turkiya va Angliyadan original kiyim va poyabzal buyurtma asosida. O'zbekiston bo'ylab 7–15 kun.">
  <meta property="og:site_name" content="Family store for men">
  <meta property="og:title" th:content="${title}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</th:block>

<!-- ===== Topbar + Header ===== -->
<th:block th:fragment="header">
  <div class="topbar"><span th:text="#{topbar}"></span></div>
  <header class="header" id="header">
    <div class="container header__inner">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu" type="button">
        <span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a th:href="@{/} + '#collection'" th:text="#{nav.collection}">Kolleksiya</a>
        <a th:href="@{/} + '#brands'" th:text="#{nav.brands}">Brendlar</a>
        <a th:href="@{/} + '#about'" th:text="#{nav.about}">Qanday ishlaymiz</a>
        <a href="#contact" th:text="#{nav.contact}">Aloqa</a>
      </nav>
      <a th:href="@{/}" class="logo">
        <span class="logo__main">FAMILY</span>
        <span class="logo__sub">STORE · FOR MEN</span>
      </a>
      <div class="header__actions">
        <div class="lang">
          <a href="?lang=uz" class="lang__btn" th:classappend="${lang == 'uz'} ? 'active'">UZ</a>
          <span>/</span>
          <a href="?lang=ru" class="lang__btn" th:classappend="${lang == 'ru'} ? 'active'">RU</a>
        </div>
        <a th:href="@{/cart}" class="icon-btn cart-btn" th:aria-label="#{nav.cart}">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 7h14l-1.2 13H6.2L5 7z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
          <span class="cart-count" th:text="${cartCount}">0</span>
        </a>
      </div>
    </div>
  </header>
</th:block>

<!-- ===== Narx: "$85+ ~$165~" ===== -->
<th:block th:fragment="price(p)">
  <span class="price__now"><span th:text="${@fmt.money(p.price)}">$0</span><sup>+</sup></span>
  <s th:if="${p.onSale()}" th:text="${@fmt.money(p.oldPrice)}"></s>
</th:block>

<!-- ===== Product card ===== -->
<article th:fragment="productCard(p)" class="product">
  <a th:href="@{/product/{id}(id=${p.id})}">
    <div class="product__media">
      <span class="product__tag" th:if="${p.tag != null}" th:text="#{'tag.' + ${p.tag.key()}}">Yangi</span>
      <span class="product__count" th:if="${p.images.size() > 1}" th:text="${p.images.size()}">4</span>
      <img th:src="${p.imageUrl}" th:alt="${p.brand + ' ' + p.name(lang)}" th:attr="data-fallback=${p.brand}" loading="lazy">
      <img th:if="${p.images.size() > 1}" class="product__alt" th:src="${p.images[1]}" alt="" loading="lazy" data-nofallback>
      <div class="product__quick" th:text="#{brands.discover}">Ko'rish</div>
    </div>
    <p class="product__brand" th:text="${p.brand}">Brand</p>
    <h3 class="product__name" th:text="${p.name(lang)}">Name</h3>
    <p class="product__price"><th:block th:replace="~{fragments/layout :: price(${p})}"></th:block></p>
  </a>
</article>

<!-- ===== Footer ===== -->
<footer th:fragment="footer" class="footer" id="contact">
  <div class="container">
    <div class="footer__cta reveal">
      <p class="eyebrow eyebrow--gold" th:text="#{footer.eyebrow}"></p>
      <h2 class="footer__title" th:text="#{footer.title}"></h2>
      <div class="footer__links">
        <a class="btn btn--gold" th:href="${store.adminUrl()}" target="_blank" rel="noopener" th:text="'@' + ${store.telegramAdmin}"></a>
        <a class="btn btn--outline" th:href="${store.channelUrl()}" target="_blank" rel="noopener" th:text="#{social.tg}"></a>
        <a class="btn btn--outline" th:href="${store.instagramUrl()}" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
    <div class="footer__grid">
      <div>
        <div class="logo logo--footer"><span class="logo__main">FAMILY</span><span class="logo__sub">STORE · FOR MEN</span></div>
        <p class="muted" th:text="#{footer.desc}"></p>
      </div>
      <div>
        <h4 th:text="#{footer.order}"></h4>
        <p><a th:href="${store.adminUrl()}" target="_blank" rel="noopener" th:text="'@' + ${store.telegramAdmin}"></a></p>
        <p><a th:href="${store.managerUrl()}" target="_blank" rel="noopener" th:text="'@' + ${store.telegramManager}"></a></p>
        <p><a th:href="${store.phoneHref()}" th:text="${store.phone}"></a></p>
      </div>
      <div>
        <h4 th:text="#{footer.contact}"></h4>
        <p><a th:href="${store.channelUrl()}" target="_blank" rel="noopener" th:text="'t.me/' + ${store.telegramChannel}"></a></p>
        <p><a th:href="${store.instagramUrl()}" target="_blank" rel="noopener" th:text="'@' + ${store.instagramUsername}"></a></p>
      </div>
      <div>
        <h4 th:text="#{footer.delivery}"></h4>
        <p class="muted" th:text="#{footer.delivery.value}"></p>
      </div>
    </div>
    <div class="footer__bottom">
      <span>© <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Family store for men</span>
      <span class="muted" th:text="#{footer.rights}"></span>
    </div>
  </div>
</footer>

<!-- ===== Toast + scripts ===== -->
<th:block th:fragment="scripts">
  <div class="toast" id="toast"
       th:with="msg=${toast != null ? toast : (error != null ? error : null)}"
       th:attr="data-message=${msg != null} ? #{'toast.' + ${msg}} : null"></div>
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
