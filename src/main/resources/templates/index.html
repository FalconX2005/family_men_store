<!doctype html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nike · Adidas · Puma')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>

<!-- Hero -->
<section class="hero">
  <div class="hero__media">
    <img src="https://images.unsplash.com/photo-1556906781-9a412961c28c?auto=format&fit=crop&w=2000&q=80" alt="" data-nofallback>
  </div>
  <div class="hero__overlay"></div>
  <div class="container hero__content">
    <p class="eyebrow reveal" th:text="#{hero.eyebrow}"></p>
    <h1 class="hero__title reveal">
      <span th:text="#{hero.title1}"></span><br>
      <em th:text="#{hero.title2}"></em> <span th:text="#{hero.title3}"></span>
    </h1>
    <p class="hero__text reveal" th:text="#{hero.text}"></p>
    <div class="hero__cta reveal">
      <a href="#collection" class="btn btn--light" th:text="#{hero.btn}"></a>
      <a href="#about" class="link-line" th:text="#{hero.link}"></a>
    </div>
  </div>
  <div class="hero__scroll">SCROLL</div>
</section>

<!-- Marquee -->
<section class="brands">
  <div class="marquee">
    <div class="marquee__track">
      <th:block th:each="i : ${#numbers.sequence(1, 4)}">
        <span>Nike</span><i>✦</i><span>Adidas</span><i>✦</i><span>Puma</span><i>✦</i><span>Original USA</span><i>✦</i>
      </th:block>
    </div>
  </div>
</section>

<!-- Brand cards -->
<section class="section categories" id="brands">
  <div class="container">
    <div class="section__head reveal">
      <p class="eyebrow eyebrow--dark" th:text="#{brands.eyebrow}"></p>
      <h2 class="section__title" th:text="#{brands.title}"></h2>
    </div>
    <div class="brand-grid">
      <a th:each="entry : ${brandCovers}"
         th:href="@{/(brand=${entry.key})} + '#collection'" class="cat-card brand-card reveal">
        <img th:if="${entry.value != null}" th:src="${entry.value}" alt="" loading="lazy" data-nofallback>
        <span class="brand-card__word" th:text="${entry.key}">Nike</span>
        <div class="cat-card__label"><span th:text="${entry.key}"></span><small th:text="#{brands.discover}"></small></div>
      </a>
    </div>
  </div>
</section>

<!-- Collection -->
<section class="section collection" id="collection">
  <div class="container">
    <div class="section__head section__head--row reveal">
      <div>
        <p class="eyebrow eyebrow--dark" th:text="#{col.eyebrow}"></p>
        <h2 class="section__title" th:text="#{col.title}"></h2>
        <p class="muted col-count" th:if="${totalProducts > 0}"
           th:text="${products.totalElements} + ' ' + #{col.count}"></p>
      </div>
      <div class="filter-block">
        <div class="filters">
          <a th:href="${selectedCategory == null} ? @{/} + '#collection' : @{/(category=${selectedCategory})} + '#collection'"
             class="filter" th:classappend="${selectedBrand == null} ? 'active'" th:text="#{col.all.brands}"></a>
          <a th:each="b : ${brands}"
             th:href="${selectedCategory == null} ? @{/(brand=${b})} + '#collection' : @{/(brand=${b},category=${selectedCategory})} + '#collection'"
             class="filter" th:classappend="${selectedBrand == b} ? 'active'" th:text="${b}"></a>
        </div>
        <div class="filters filters--sub" th:unless="${#lists.isEmpty(shopCategories)}">
          <a th:href="${selectedBrand == null} ? @{/} + '#collection' : @{/(brand=${selectedBrand})} + '#collection'"
             class="filter" th:classappend="${selectedCategory == null} ? 'active'" th:text="#{col.all.categories}"></a>
          <a th:each="c : ${shopCategories}"
             th:href="${selectedBrand == null} ? @{/(category=${c.key()})} + '#collection' : @{/(brand=${selectedBrand},category=${c.key()})} + '#collection'"
             class="filter" th:classappend="${selectedCategory == c.key()} ? 'active'"
             th:text="#{'category.' + ${c.key()}}"></a>
        </div>
      </div>
    </div>

    <div class="product-grid">
      <th:block th:each="p : ${products.content}">
        <article th:replace="~{fragments/layout :: productCard(${p})}"></article>
      </th:block>
    </div>

    <div class="empty-state" th:if="${products.isEmpty()}">
      <p th:text="#{col.empty}"></p>
      <a class="btn btn--dark" th:href="${store.channelUrl()}" target="_blank" rel="noopener" th:text="#{social.tg}"></a>
    </div>

    <nav class="pager" th:if="${products.totalPages > 1}">
      <a th:if="${products.hasPrevious()}" class="filter" th:href="${pageBase} + ${products.number - 1} + '#collection'" th:text="#{col.prev}"></a>
      <span class="pager__info" th:text="${products.number + 1} + ' / ' + ${products.totalPages}"></span>
      <a th:if="${products.hasNext()}" class="filter" th:href="${pageBase} + ${products.number + 1} + '#collection'" th:text="#{col.next}"></a>
    </nav>

    <p class="price-note" th:unless="${products.isEmpty()}" th:text="#{price.note}"></p>
  </div>
</section>

<!-- About -->
<section class="editorial" id="about">
  <div class="editorial__media reveal">
    <img src="https://images.unsplash.com/photo-1460353581641-37baddab0fa2?auto=format&fit=crop&w=1400&q=80" alt="" loading="lazy" data-nofallback>
  </div>
  <div class="editorial__content reveal">
    <p class="eyebrow eyebrow--gold" th:text="#{about.eyebrow}"></p>
    <h2 class="editorial__title" th:text="#{about.title}"></h2>
    <p th:text="#{about.text1}"></p>
    <p th:text="#{about.text2}"></p>
    <div class="stats">
      <div><strong>10K+</strong><span th:text="#{stat1}"></span></div>
      <div><strong>3</strong><span th:text="#{stat2}"></span></div>
      <div><strong th:text="${store.deliveryDays}">7–15</strong><span th:text="#{stat3}"></span></div>
    </div>
  </div>
</section>

<!-- Steps -->
<section class="section promises">
  <div class="container">
    <div class="section__head reveal">
      <h2 class="section__title section__title--sm" th:text="#{step.title}"></h2>
    </div>
    <div class="promise-grid">
      <div class="promise reveal">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <h3 th:text="#{p1.t}"></h3><p th:text="#{p1.d}"></p>
      </div>
      <div class="promise reveal">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M21 4L3 11l7 2 2 7 9-16z"/><path d="M10 13l4-4"/></svg>
        <h3 th:text="#{p2.t}"></h3><p th:text="#{p2.d}"></p>
      </div>
      <div class="promise reveal">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 10h18M7 15h3"/></svg>
        <h3 th:text="#{p3.t}"></h3><p th:text="#{p3.d}"></p>
      </div>
      <div class="promise reveal">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>
        <h3 th:text="#{p4.t}"></h3><p th:text="#{p4.d}"></p>
      </div>
    </div>
  </div>
</section>

<!-- Social -->
<section class="social">
  <div class="container social__inner reveal">
    <div>
      <p class="eyebrow eyebrow--gold" th:text="#{social.eyebrow}"></p>
      <h2 class="section__title" th:text="#{social.title}"></h2>
      <p class="social__text" th:text="#{social.text}"></p>
    </div>
    <div class="social__cards">
      <a class="social-card" th:href="${store.channelUrl()}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M21.9 4.3l-3.2 15.1c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1.1-1 .2-1.5L20.5 2.8c.9-.3 1.7.2 1.4 1.5z"/></svg>
        <span><strong th:text="#{social.tg}"></strong><small th:text="'t.me/' + ${store.telegramChannel}"></small></span>
      </a>
      <a class="social-card" th:href="${store.instagramUrl()}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        <span><strong>Instagram · 10K+</strong><small th:text="'@' + ${store.instagramUsername}"></small></span>
      </a>
      <a class="social-card" th:href="${store.adminUrl()}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
        <span><strong th:text="#{social.admin}"></strong><small th:text="'@' + ${store.telegramAdmin}"></small></span>
      </a>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
