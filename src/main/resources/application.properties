spring.application.name=family-mens-store
server.port=8150

# ===== Ma'lumotlar bazasi (H2 — fayl, ./data papkasida saqlanadi) =====
spring.datasource.url=jdbc:h2:file:./data/store;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# PostgreSQL ga o'tish uchun: --spring.profiles.active=prod (application-prod.properties)

# ===== Sessiya cookie xavfsizligi =====
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
# HTTPS orqali ishlaganda: server.servlet.session.cookie.secure=true
server.error.include-stacktrace=never
server.error.include-message=never

# ===== i18n =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== Fayl yuklash =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# ===== Do'kon ma'lumotlari (Instagram va Telegram bilan bir xil) =====
store.name=Family store for men
store.telegram-channel=familystoreformen
store.telegram-admin=familystoremen_admin
store.telegram-manager=familystoremen
store.instagram-username=family.store.men
store.phone=+998 33 380 01 00
store.prepayment-percent=20
store.delivery-days=7–15
store.upload-dir=./uploads

# ===== Telegram kanal -> sayt sinxronizatsiyasi =====
# Kanaldagi har bir post (rasm + narx) saytda avtomatik mahsulot bo'lib chiqadi
store.sync.enabled=true
# Darhol yangilash: @Falcon_Sbot kanalga admin qilib qo'shilsa, yangi post bir necha soniyada saytda chiqadi
store.sync.instant=false
# Kanal necha vaqtda bir tekshirilsin (PT1M = 1 daqiqa, PT30S = 30 soniya)
store.sync.interval=PT1M
# Birinchi ishga tushganda nechta sahifa (1 sahifa ~ 20 post) yuklansin
store.sync.initial-pages=5
# Bir tekshiruvda ko'pi bilan nechta sahifa
store.sync.max-pages-per-run=5

# ===== Yangi buyurtmalar haqida Telegram bot xabari (ixtiyoriy) =====
# @BotFather dan token oling; chat-id: @familystoremen_admin akkauntining ID si (@userinfobot)
store.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
store.telegram-chat-id=${TELEGRAM_CHAT_ID:}

# Admin panel login (/admin). Parol berilmasa, har ishga tushganda tasodifiy parol logga yoziladi.
store.admin-username=${ADMIN_USERNAME:admin}
store.admin-password=${ADMIN_PASSWORD:}
